<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycle Time 分析儀表板</title>
<style>
:root{--bg:#fff;--fg:#1f2430;--mut:#6b7280;--card:#f3f5f9;--acc:#2563eb;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e8eaee;--mut:#9aa3b2;--card:#1e232b;--acc:#6ea0ff;--bd:#333a46}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#e8eaee;--mut:#9aa3b2;--card:#1e232b;--acc:#6ea0ff;--bd:#333a46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans TC","PingFang TC",sans-serif;padding:16px;max-width:820px;line-height:1.5}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.big{font-size:24px;font-weight:700;color:var(--acc)}.mut{color:var(--mut);font-size:13px}
input,select,button,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.bar b{width:44px}
.track{flex:1;height:22px;background:var(--bd);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%}.val{width:92px;text-align:right;font-size:13px}
.leg{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
svg text{fill:var(--fg);font-family:inherit}
</style>
</head>
<body>
<h1>⏱ 工作站 Cycle Time 分析儀表板</h1>
<div class="card">
  <input type="file" id="f" accept=".csv,.xlsx,.xls,text/csv">
  <p><button id="demo">載入範例資料（G17）</button></p>
  <textarea id="paste" rows="3" style="width:100%" placeholder="或把 CSV 內容整段貼在這裡"></textarea>
  <p><button id="go">計算貼上的資料</button></p>
  <p class="mut">上傳含 station_id、product_id、start_time、finish_time 欄位的 CSV。資料只在瀏覽器內計算，不會上傳。</p>
  <label class="mut">場次（round_flow_id）：<select id="r"></select></label>
</div>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const COL=['#2563eb','#16a34a','#d97706','#9333ea','#0891b2'];
let rows=[];
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const R=[];let c='',r=[],q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}
    else c+=ch}
  if(c||r.length){r.push(c);R.push(r)}
  const h=R[0].map(x=>x.trim());
  return R.slice(1).filter(x=>x.length>=h.length).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])));
}
const f1=x=>isFinite(x)?x.toFixed(1):'-';
function flow(stat,bn,units,last){
  const ins=stat.filter(s=>s.st!==last.st),H=Math.max(200,ins.length*110+20),bw=230,bh=86;
  const ex=470,ey=H/2-bh/2;let g='';
  ins.forEach((s,i)=>{
    const y=20+i*110,isb=s.st===bn.st,wait=s.n-units;
    g+=`<path d="M${10+bw} ${y+bh/2} C ${ex-80} ${y+bh/2}, ${ex-80} ${H/2}, ${ex} ${H/2}" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="10" y="${y}" width="${bw}" height="${bh}" rx="6" style="fill:${isb?'rgba(220,38,38,.18)':'rgba(22,163,74,.18)'};stroke:${isb?'#dc2626':'#16a34a'}" stroke-width="${isb?4:2}"/>
    <text x="${10+bw/2}" y="${y+22}" text-anchor="middle" font-weight="700" font-size="15">${s.st}</text>
    <text x="${10+bw/2}" y="${y+43}" text-anchor="middle" font-size="13">累計完工: ${s.n} 件（待領: ${Math.max(0,wait)} 件）</text>
    <text x="${10+bw/2}" y="${y+64}" text-anchor="middle" font-size="13" ${isb?'font-weight="700" style="fill:#dc2626"':''}>${isb?'🚨 瓶頸站 ':''}CT: ${f1(s.ct)}s ｜ 閒置 ${f1(s.idle/s.W*100)}%</text>`});
  const lb=last.st===bn.st;
  g+=`<rect x="${ex}" y="${ey}" width="${bw}" height="${bh}" rx="6" style="fill:rgba(217,119,6,.2);stroke:${lb?'#dc2626':'#d97706'}" stroke-width="${lb?4:2}"/>
  <text x="${ex+bw/2}" y="${ey+22}" text-anchor="middle" font-weight="700" font-size="15">${last.st}</text>
  <text x="${ex+bw/2}" y="${ey+43}" text-anchor="middle" font-size="13">🏁 總成品: ${units} 件</text>
  <text x="${ex+bw/2}" y="${ey+64}" text-anchor="middle" font-size="13" ${lb?'font-weight="700" style="fill:#dc2626"':''}>${lb?'🚨 瓶頸站 ':''}CT: ${f1(last.ct)}s ｜ 閒置 ${f1(last.idle/last.W*100)}%</text>`;
  return `<svg viewBox="0 0 720 ${H}" width="100%" role="img" aria-label="流程圖"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6b7280"/></marker></defs>${g}</svg>`;
}
function gantt(d,sts,t0,W){
  const L=44,w=700,rh=34,H=sts.length*rh+30;let g='';
  const step=W>600?100:W>200?50:20;
  for(let t=0;t<=W;t+=step){const x=L+t/W*(w-L-6);g+=`<line x1="${x}" x2="${x}" y1="0" y2="${H-24}" stroke="#9aa3b2" stroke-opacity=".3"/><text x="${x}" y="${H-8}" font-size="11" text-anchor="middle">${t}s</text>`}
  sts.forEach((st,i)=>{
    g+=`<text x="2" y="${i*rh+22}" font-size="12">${st}</text>`;
    d.filter(x=>x.st===st).forEach(x=>{
      const a=L+(x.s-t0)/W*(w-L-6),b=Math.max(2,(x.f-x.s)/W*(w-L-6));
      g+=`<rect x="${a}" y="${i*rh+6}" width="${b}" height="22" rx="3" fill="${COL[i%5]}"><title>${x.p||''} ${st}: ${f1(x.f-x.s)}s</title></rect>`})});
  return `<svg viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="甘特圖">${g}</svg>`;
}
function calc(){
  const sel=document.getElementById('r').value;
  const d=rows.filter(x=>/^ST\d+/i.test(x.station_id||'')&&(sel==='__all'||x.round_flow_id===sel))
    .map(x=>({st:x.station_id,p:x.product_id,s:Date.parse(x.start_time)/1000,f:Date.parse(x.finish_time)/1000}))
    .filter(x=>isFinite(x.s)&&isFinite(x.f));
  const o=document.getElementById('out');
  if(!d.length){o.innerHTML='<div class="card">找不到有效資料，請檢查欄位名稱。</div>';return}
  const t0=Math.min(...d.map(x=>x.s)),t1=Math.max(...d.map(x=>x.f)),W=t1-t0;
  const sts=[...new Set(d.map(x=>x.st))].sort();
  const stat=sts.map((st,i)=>{
    const h=d.filter(x=>x.st===st).sort((a,b)=>a.s-b.s);
    const busy=h.reduce((a,x)=>a+x.f-x.s,0);
    let gap=0;for(let k=1;k<h.length;k++)gap+=Math.max(0,h[k].s-h[k-1].f);
    return{st,n:h.length,ct:busy/h.length,busy,idle:W-busy,gap,W,c:COL[i%5]}});
  const last=stat[stat.length-1];
  const units=new Set(d.filter(x=>x.st===last.st).map(x=>x.p)).size;
  const bn=stat.reduce((a,b)=>b.ct>a.ct?b:a);
  const mx=Math.max(...stat.map(s=>s.ct));
  let h=`<div class="row"><div class="card"><div class="mut">整條線 Cycle Time（產出基準）</div><div class="big">${units?f1(W/units):'-'} 秒/組</div><div class="mut">總耗時 ${f1(W)} 秒 ÷ 成品 ${units} 組</div></div>
  <div class="card"><div class="mut">理想 Cycle Time（瓶頸站 ${bn.st}）</div><div class="big">${f1(bn.ct)} 秒</div><div class="mut">各站平均作業時間最大者</div></div>
  <div class="card"><div class="mut">效率落差</div><div class="big">${units?f1(W/units/bn.ct):'-'} 倍</div><div class="mut">實際 ÷ 理想，越大代表等待越多</div></div></div>
  <h2>生產流程圖</h2><div class="card">${flow(stat,bn,units,last)}<div class="mut">紅框為瓶頸站；待領 = 該站完工但尚未進入終點站的件數。</div></div>
  <h2>各站 Cycle Time 比較</h2><div class="card">`;
  stat.forEach(s=>h+=`<div class="bar"><b>${s.st}</b><div class="track"><i style="width:${s.ct/mx*100}%;background:${s.c}"></i></div><span class="val">${f1(s.ct)} 秒</span></div>`);
  h+=`</div><h2>作業 vs 閒置時間（占整個場次）</h2><div class="card">`;
  stat.forEach(s=>h+=`<div class="bar"><b>${s.st}</b><div class="track"><i style="width:${s.busy/W*100}%;background:${s.c}"></i><i style="width:${s.idle/W*100}%;background:var(--bd)"></i></div><span class="val">閒置 ${f1(s.idle/W*100)}%</span></div>`);
  h+=`<div class="leg"><span style="--c:#6b7280">深色 = 作業中</span><span style="--c:var(--bd)">灰色 = 閒置</span></div></div>
  <h2>時間軸（甘特圖）</h2><div class="card scroll">${gantt(d,sts,t0,W)}<div class="mut">每個方塊代表一件產品在該站的作業，滑鼠移上去可看產品與秒數。</div></div>
  <h2>明細</h2><div class="card scroll"><table><tr><th>站</th><th>件數</th><th>Cycle Time</th><th>作業總時間</th><th>閒置時間</th><th>閒置率</th><th>件間空檔</th></tr>`;
  stat.forEach(s=>h+=`<tr><td>${s.st}</td><td>${s.n}</td><td>${f1(s.ct)}</td><td>${f1(s.busy)}</td><td>${f1(s.idle)}</td><td>${f1(s.idle/W*100)}%</td><td>${f1(s.gap)}</td></tr>`);
  h+=`</table></div><p class="mut">閒置時間 = 場次總時間（${f1(W)} 秒）− 該站作業總時間。流程圖以最後一站為終點站，其餘站為前段工作站。</p>`;
  o.innerHTML=h;
}
document.getElementById('f').addEventListener('change',e=>{
  const fl=e.target.files[0];if(!fl)return;
  if(/\.xls/i.test(fl.name)){const xr=new FileReader();xr.onload=()=>{try{const wb=XLSX.read(xr.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames.includes('in')?'in':wb.SheetNames[0]];load(XLSX.utils.sheet_to_csv(ws))}catch(err){document.getElementById('out').innerHTML='<div class="card">Excel 讀取失敗，請改用 CSV，或按「載入範例資料」。</div>'}};xr.readAsArrayBuffer(fl);return}
  const rd=new FileReader();
  rd.onload=()=>{rows=parseCSV(rd.result);
    const rs=[...new Set(rows.map(x=>x.round_flow_id).filter(Boolean))];
    const s=document.getElementById('r');
    s.innerHTML=rs.map(x=>`<option>${x}</option>`).join('')+'<option value="__all">全部合併</option>';
    if(rs.includes('G17-T1'))s.value='G17-T1';
    calc()};
  rd.readAsText(fl,'utf-8');
});

const DEMO=`round_flow_id,product_id,station_id,start_time,finish_time

function load(txt){rows=parseCSV(txt);
  const rs=[...new Set(rows.map(x=>x.round_flow_id).filter(Boolean))];
  const s=document.getElementById('r');
  s.innerHTML=rs.map(x=>`<option>${x}</option>`).join('')+'<option value="__all">全部合併</option>';
  if(rs.includes('G17-T1'))s.value='G17-T1';
  calc()}
document.getElementById('demo').onclick=()=>load(DEMO);
document.getElementById('go').onclick=()=>load(document.getElementById('paste').value);
document.getElementById('r').addEventListener('change',calc);
</script>
</body>
</html>
